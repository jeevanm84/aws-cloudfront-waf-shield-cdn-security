name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate Markdown, links, and identity policy
        run: python3 scripts/check.py

  validate-terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.7.5"
      - name: Terraform format check
        run: terraform -chdir=examples/terraform fmt -check
      - name: Terraform init (no backend, validate only)
        run: terraform -chdir=examples/terraform init -backend=false
      - name: Terraform validate
        run: terraform -chdir=examples/terraform validate
